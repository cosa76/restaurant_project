# CD : à chaque merge sur main, on déploie d'abord en uat, puis en prod
# après approbation manuelle (règle "Required reviewers" de l'environnement
# production dans GitHub). La base et la doc sont publiées en artefacts.
name: dbt CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : un nouveau merge attend la fin du précédent.
concurrency:
  group: dbt-deploy
  cancel-in-progress: false

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer dbt
        run: pip install -r requirements.txt

      - name: Build uat
        run: dbt build --profiles-dir . --target uat

      - name: Publier la base uat
        uses: actions/upload-artifact@v4
        with:
          name: restaurant_uat-duckdb
          path: restaurant_uat.duckdb

  deploy-prod:
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer dbt
        run: pip install -r requirements.txt

      - name: Build prod
        run: dbt build --profiles-dir . --target prod

      - name: Générer la documentation
        run: dbt docs generate --profiles-dir . --target prod

      - name: Publier la base prod
        uses: actions/upload-artifact@v4
        with:
          name: restaurant_prod-duckdb
          path: restaurant_prod.duckdb

      - name: Publier la doc
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            target/index.html
            target/manifest.json
            target/catalog.json
