# CD : à chaque merge sur main, on construit la target prod,
# puis on publie la base DuckDB et la doc dbt comme artefacts.
name: dbt CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dbt-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer dbt
        run: pip install -r requirements.txt

      - name: Build prod
        run: dbt build --profiles-dir . --target prod

      - name: Générer la documentation
        run: dbt docs generate --profiles-dir . --target prod

      - name: Publier la base prod
        uses: actions/upload-artifact@v4
        with:
          name: restaurant_prod-duckdb
          path: restaurant_prod.duckdb

      - name: Publier la doc
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            target/index.html
            target/manifest.json
            target/catalog.json
